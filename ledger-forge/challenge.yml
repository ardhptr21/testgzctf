name: ledger-forge
author: TCP1P
description: >
  **ledger-forge** — a JWT-authenticated expense-ledger API. Register, log in,

  add expense entries, list them, and (admins only) render a templated report.

  Tokens are RS256-signed with a persisted RSA keypair; the matching

  public key is published at `/pubkey`.


  Two deliberately planted, **chained** bugs leak the flag. First, the token

  verifier is hand-rolled and trusts the JWT `alg` header: it verifies `HS256`

  tokens with the **public-key PEM bytes** as the HMAC secret (algorithm

  confusion). Fetch `/pubkey`, forge an `HS256` token claiming

  `{"user":"...","role":"admin"}`, and you are admin. Second, the admin-only

  `POST /admin/report` renders your supplied Jinja2 template server-side

  (**SSTI → RCE**). V2 flags are stored as private ledger entries through the

  normal account APIs, alongside other service data.


  Defenders: patch **both** bugs — accept only `RS256` in the verifier AND stop

  rendering the user template — without breaking the register / login /

  add-entry / list flow the checker drives. Preserve `/app/data` while patching

  and restarting: retained private records must remain available to their owners.
type: AttackDefense
category: Web
# containerImage omitted on purpose -> the platform auto-builds ./src/Dockerfile
# on import. Do NOT pin a gzctf-auto/... tag here; that's the platform's own
# build output and would turn this into a non-building "registry image".
container:
  memoryLimit: 512
  cpuCount: 1
  storageLimit: 512
  exposePort: 8080
ad:
  # V2 persistent functionality + retained-data checker. The ./checker image is
  # built automatically from its Dockerfile on sync/import — do NOT set
  # checkerImage here; the tooling builds it and wires up the ref. The worker
  # listens on port 8081 and accepts POST /check requests.
  # Public egress enabled.
  allowEgress: true
  allowSelfReset: true
  # Gate SSH behind offense: when true, a team can SSH into its own service
  # container only after capturing at least one flag for this challenge.
  # Default false (SSH open to any team that registered a key).
  sshRequiresFlag: false
  # Bring-your-own-container: each team runs this service on its OWN machine and
  # connects it through the GZCTF tunnel agent (download setup.sh from the
  # challenge panel → `sh setup.sh`). GZCTF launches only a relay; the checker,
  # attack proxy, flag rotation and scoreboard all work unchanged. Set false (or
  # remove) to have GZCTF host the container per team instead.
  selfHosted: true
